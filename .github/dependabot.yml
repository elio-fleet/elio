# Minor and patch updates come grouped, once a week, one PR per ecosystem;
# major versions and security updates (not covered by the groups) stay one
# PR each, to be read and tested on their own.
version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  target-branch: develop
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    gems:
      update-types: [minor, patch]
- package-ecosystem: github-actions
  directory: "/"
  target-branch: develop
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    actions:
      update-types: [minor, patch]
- package-ecosystem: docker
  directory: "/"
  target-branch: develop
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    docker:
      update-types: [minor, patch]
