en:
  activerecord:
    models:
      server: Server
      server_group: Server group
      public_key: Keyring key
      user: User
      notification_channel: Notification channel
      automation: Automation
    attributes:
      server:
        name: Name
        host: Host
        port: Port
        username: User
        expected_ports: The expected ports
        extra_addresses_text: The extra addresses
        health_thresholds: The health thresholds
      server_group:
        name: Name
        color: Color
        expected_ports: The expected ports
        health_thresholds: The health thresholds
      public_key:
        name: Name
        kind: Type
        content: Public SSH key
        description: Description
        fingerprint: This key
      notification_channel:
        name: Name
        webhook_url: The webhook URL
        recipients: The recipients
        activity_kinds: The activities
      automation:
        interval_minutes: The frequency
        window_end_hour: The hours
      invitation:
        email: The email
        role: The role
      user:
        role: The role
        email: Email
        password: Password
        password_confirmation: Password confirmation
    errors:
      messages:
        health_threshold_range: must be between 1 and 100 % (the load between 0.1 and 50)
        health_threshold_order: must have each warning below its critical
      models:
        automation:
          attributes:
            window_end_hour:
              same_as_start: must end at another hour than they start
        server:
          attributes:
            host:
              address_taken: is already used by another server with the same port and user
            expected_ports:
              invalid_ports: 'contain invalid values: %{ports} (for example: “22, 80, 443/tcp, 51820/udp”)'
            extra_addresses_text:
              invalid_ips: 'contain values that are not IP addresses: %{addresses}'
        notification_channel:
          attributes:
            recipients:
              too_many: cannot be more than %{count} addresses
              invalid_emails: 'contain invalid addresses: %{emails}'
        server_group:
          attributes:
            expected_ports:
              invalid_ports: 'contain invalid values: %{ports} (for example: “22, 80, 443/tcp, 51820/udp”)'
        public_key:
          attributes:
            content:
              invalid: must be a single public key, for example “ssh-ed25519 AAAA… alice@laptop”
              private_key: 'looks like a private key: paste the public key (.pub file)'
              app_key: is Elio's key and cannot be added to the keyring
            user:
              server_key: "is a server's key: only a person's key has an owner"
            fingerprint:
              taken: is already in the keyring
        user:
          attributes:
            password:
              same_as_before: must differ from the previous one
            base:
              last_admin: There must always be at least one active administrator.
        invitation:
          attributes:
            email:
              taken_by_user: already belongs to a user
              already_invited: already has a pending invitation
  devise:
    failure:
      invalid: "Invalid %{authentication_keys} or password. After %{maximum_attempts} failed attempts in a row, an account is locked for %{duration}."
      not_found_in_database: "Invalid %{authentication_keys} or password. After %{maximum_attempts} failed attempts in a row, an account is locked for %{duration}."
      last_attempt: "Invalid %{authentication_keys} or password. One attempt left: after another failure, this account is locked for %{duration}."
      locked: "Too many failed attempts: this account is locked for %{duration} at most. An administrator can unlock it sooner."
      deactivated: This account has been deactivated. Contact an administrator.
  time:
    formats:
      short: "%b %d %H:%M"
      hour_minute: "%H:%M"
  number:
    percentage:
      format:
        format: "%n%"
