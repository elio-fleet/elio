      help:
        title: Create a read-only API token in Technitium
        step1_html: "<strong>Administration → Groups</strong>: add a group (e.g. <code>Elio read-only</code>), and in <strong>Administration → Permissions</strong> give it <strong>View</strong> only on <strong>Zones</strong>."
        step2_html: "<strong>Administration → Users</strong>: add a user (e.g. <code>elio</code>) member of that group only."
        step3_html: 'Technitium also has <strong>permissions per zone</strong>: on each zone to read (<strong>Zones</strong>, the zone, <strong>Permissions</strong>), give the group <strong>View</strong>. Without it, the token sees no zone.'
        step4_html: Log in as that user, then <strong>Create API Token</strong> (user menu, top right), and paste it here.
        reads_html: 'Elio only reads: <code>/api/user/session/get</code>, <code>/api/zones/list</code> and <code>/api/zones/records/get</code>, with the token in an <code>Authorization: Bearer</code> header (tested with Technitium DNS Server 15.6).'
