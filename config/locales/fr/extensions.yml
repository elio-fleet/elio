          other: "%{count} rattachés à aucun serveur"
      help:
        title: Créer un jeton d'accès personnel en lecture seule chez Gandi
        step1_html: "Dans l'<strong>admin Gandi</strong> (admin.gandi.net), ouvrez <strong>Organisations</strong>, puis <strong>Jetons d'accès personnels</strong> (ou les réglages de votre compte), et créez un jeton."
        step2_html: "Choisissez l'<strong>organisation</strong> propriétaire des domaines, et une <strong>expiration</strong> courte que vous renouvellerez."
        step3_html: "Donnez-lui <strong>seulement les droits de voir les domaines et leurs enregistrements DNS (LiveDNS)</strong> : aucun droit de modifier, renouveler, transférer ou acheter."
        step4_html: "Collez le jeton ici ; si les domaines appartiennent à une autre organisation que votre organisation personnelle, collez son ID dans <strong>Organisation</strong>."
        reads_html: "Elio ne fait que lire, avec le jeton dans un en-tête <code>Authorization: Bearer</code> : <code>GET /v5/livedns/domains</code>, <code>GET /v5/livedns/domains/{domaine}/records</code> et <code>GET /v5/domain/domains</code>. Pas encore essayé sur un vrai compte Gandi."
