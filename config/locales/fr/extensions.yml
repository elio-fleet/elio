      help:
        title: Créer un jeton en lecture seule
        step1_html: 'Dans Coolify, <strong class="font-medium">Settings › Advanced</strong> : activez <strong class="font-medium">API access</strong> ; si « Allowed API IPs » est rempli, ajoutez-y l''adresse d''Elio.'
        step2_html: Passez sur l'<strong class="font-medium">équipe</strong> à suivre (menu des équipes, en haut à gauche).
        step3_html: '<strong class="font-medium">Keys &amp; Tokens › API Tokens</strong> → nouveau jeton, permission <strong class="font-medium">read</strong> seulement, une expiration au choix.'
        step4_html: Ajoutez une connexion ici avec l'adresse de l'instance et ce jeton.
        one_team_html: 'Un jeton Coolify ne voit <strong class="font-medium">qu''une équipe</strong>, et l''API ne dit pas lesquelles existent : ajoutez une connexion par équipe. Le serveur qui fait tourner Coolify appartient à l''équipe « Root ».'
