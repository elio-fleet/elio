      help:
        title: Créer un jeton d'API en lecture seule dans Technitium
        step1_html: "<strong>Administration → Groups</strong> : ajoutez un groupe (par exemple <code>Elio read-only</code>), puis dans <strong>Administration → Permissions</strong> donnez-lui seulement <strong>View</strong> sur <strong>Zones</strong>."
        step2_html: "<strong>Administration → Users</strong> : ajoutez un utilisateur (par exemple <code>elio</code>) membre de ce groupe seulement."
        step3_html: 'Technitium a aussi des <strong>droits par zone</strong> : sur chaque zone à lire (<strong>Zones</strong>, la zone, <strong>Permissions</strong>), donnez <strong>View</strong> au groupe. Sans cela, le jeton ne voit aucune zone.'
        step4_html: Connectez-vous avec cet utilisateur, puis <strong>Create API Token</strong> (menu de l'utilisateur, en haut à droite), et collez-le ici.
        reads_html: 'Elio ne fait que lire : <code>/api/user/session/get</code>, <code>/api/zones/list</code> et <code>/api/zones/records/get</code>, avec le jeton dans un en-tête <code>Authorization: Bearer</code> (testé avec Technitium DNS Server 15.6).'
