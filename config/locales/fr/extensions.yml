    monitors:
      intro: Je surveille mes serveurs Linux avec Uptime Kuma. Voici ce qu'Elio (un outil d'inventaire) sait de l'un d'eux. Propose les sondes Uptime Kuma à créer pour lui.
      task: 'Propose la liste des sondes à créer, sous forme de tableau : type (HTTP(s), HTTP(s) mot-clé, port TCP, ping, DNS, conteneur Docker…), cible (URL, hôte:port), intervalle de vérification, et pourquoi. Ne reprends pas les sondes qui existent déjà. Privilégie ce que les utilisateurs atteignent vraiment (adresses publiques, noms de domaine) ; une sonde sur une adresse privée ou VPN demande une instance Uptime Kuma sur ce réseau : précise-le. Ajoute une vérification de l''expiration du certificat pour les services HTTPS. Demande-moi ce qui manque (noms de domaine, URL à vérifier).'
    firewall:
      local:
        intro: Voici ce qu'Elio (un outil d'inventaire) sait de mon serveur Linux. Propose les règles de son firewall.
        task: 'Propose les règles du firewall de la machine, sous forme de commandes ufw à lancer dans l''ordre. Garde l''accès SSH d''Elio ouvert sur le port %{ssh_port} (ne restreins sa source que si je te donne l''adresse d''Elio). N''autorise que les ports publics qui doivent être joignables, et explique ceux que tu fermerais ou restreindrais. Signale les ports exposés par Docker (ils contournent ufw) et ce qui couperait les connexions en cours.'
      ovh:
        intro: Mon serveur Linux est hébergé chez OVHcloud. Voici ce qu'Elio (un outil d'inventaire) en sait. Propose les règles de ses firewalls, celui de la machine et le firewall réseau OVHcloud (Edge Network Firewall) de ses adresses IP publiques.
        task: 'Propose d''abord les règles du firewall réseau OVHcloud pour chaque IP publique, sous forme de tableau : séquence (0 à 19, la première règle qui correspond s''applique), action (permit / deny), protocole, port de destination, source, option TCP. Ce firewall est sans état : prévois ce qui laisse revenir les réponses aux connexions sortantes du serveur (par exemple l''option TCP established), et termine par une règle qui refuse le reste. Il ne filtre que l''IPv4. Puis les règles du firewall de la machine, en commandes ufw. Garde l''accès SSH d''Elio ouvert sur le port %{ssh_port} (ne restreins sa source que si je te donne l''adresse d''Elio). N''autorise que les ports publics qui doivent être joignables, et explique ceux que tu fermerais ou restreindrais. Signale les ports exposés par Docker et les différences entre les deux firewalls.'
