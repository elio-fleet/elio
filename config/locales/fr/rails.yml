fr:
  activerecord:
    models:
      server: Serveur
      server_group: Groupe de serveurs
      public_key: Clé du trousseau
      user: Utilisateur
      notification_channel: Canal de notification
      automation: Automatisation
    attributes:
      server:
        name: Nom
        host: Hôte
        port: Port
        username: Utilisateur
        expected_ports: Les ports attendus
        extra_addresses_text: Les adresses supplémentaires
      server_group:
        name: Nom
        color: Couleur
        expected_ports: Les ports attendus
      public_key:
        name: Nom
        kind: Type
        content: Clé SSH publique
        description: Description
        fingerprint: Cette clé
      notification_channel:
        name: Nom
        webhook_url: L'URL du webhook
        recipients: Les destinataires
        activity_kinds: Les activités
      automation:
        interval_minutes: La fréquence
        window_end_hour: Les heures
      invitation:
        email: L'email
        role: Le rôle
      user:
        role: Le rôle
        email: Email
        password: Mot de passe
        password_confirmation: Confirmation du mot de passe
    errors:
      models:
        automation:
          attributes:
            window_end_hour:
              same_as_start: doivent finir à une autre heure que leur début
        server:
          attributes:
            host:
              address_taken: est déjà utilisé par un autre serveur avec le même port et le même utilisateur
            expected_ports:
              invalid_ports: 'contiennent des valeurs invalides : %{ports} (exemple : « 22, 80, 443/tcp, 51820/udp »)'
            extra_addresses_text:
              invalid_ips: 'contiennent des valeurs qui ne sont pas des adresses IP : %{addresses}'
        notification_channel:
          attributes:
            recipients:
              too_many: ne peuvent pas dépasser %{count} adresses
              invalid_emails: 'contiennent des adresses invalides : %{emails}'
        server_group:
          attributes:
            expected_ports:
              invalid_ports: 'contiennent des valeurs invalides : %{ports} (exemple : « 22, 80, 443/tcp, 51820/udp »)'
        public_key:
          attributes:
            content:
              invalid: doit être une seule clé publique, par exemple « ssh-ed25519 AAAA… alice@laptop »
              private_key: 'ressemble à une clé privée : collez la clé publique (fichier .pub)'
              app_key: est la clé d'Elio et ne peut pas être ajoutée au trousseau
            user:
              server_key: "est une clé de serveur : seule la clé d'une personne a un propriétaire"
            fingerprint:
              taken: est déjà dans le trousseau
        user:
          attributes:
            password:
              same_as_before: doit être différent du précédent
            base:
              last_admin: Il doit toujours rester au moins un administrateur actif.
        invitation:
          attributes:
            email:
              taken_by_user: correspond déjà à un utilisateur
              already_invited: a déjà une invitation en attente
  devise:
    failure:
      invalid: "%{authentication_keys} ou mot de passe incorrect. Après %{maximum_attempts} échecs de suite, un compte est verrouillé pendant %{duration}."
      not_found_in_database: "%{authentication_keys} ou mot de passe incorrect. Après %{maximum_attempts} échecs de suite, un compte est verrouillé pendant %{duration}."
      last_attempt: "%{authentication_keys} ou mot de passe incorrect. Encore un essai : après un nouvel échec, ce compte est verrouillé pendant %{duration}."
      locked: "Trop d'essais ratés : ce compte est verrouillé pendant %{duration} au plus. Un administrateur peut le déverrouiller avant."
      deactivated: Ce compte a été désactivé. Contactez un administrateur.
  time:
    formats:
      short: "%d %b %H:%M"
      hour_minute: "%H:%M"
  number:
    percentage:
      format:
        format: "%n %"
