shared: &shared
  expire_temporary_accesses:
    class: ExpireTemporaryAccessesJob
    schedule: every minute
  run_due_automations:
    class: RunDueAutomationsJob
    schedule: every minute
  notification_digests:
    class: NotificationDigestJob
    schedule: every day at 8am
  purge_health_samples:
    class: Inventory::PurgeHealthSamplesJob
    schedule: every day at 4am
  purge_activities:
    class: PurgeActivitiesJob
    schedule: every day at 4:30am
  purge_background_tasks:
    class: PurgeBackgroundTasksJob
    schedule: every day at 4:15am
  sweep_stale_tasks:
    class: SweepStaleTasksJob
    schedule: every 15 minutes
  deliver_due_notification_batches:
    class: DeliverDueNotificationBatchesJob
    schedule: every 5 minutes

development:
  <<: *shared

production:
  <<: *shared
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
