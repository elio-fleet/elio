# Every command Elio runs on the servers, over SSH. This file is the only
# place they are written: the services load them through Ssh::Commands
# (Ssh::Connection#run_command), so what is here is exactly what runs.
#
# Layout: role → command → variants.
#
#   <role>:
#     <command>:
#       description: what it is for (shown in the README and the tests)
#       writes: true          # changes something on the server (only keys.*); everything else is read-only
#       run_as: root          # needs root: prefixed with `sudo -n` when Elio logs in through sudo
#                             # (see connection.sudo_probe), run as is when it logs in as root,
#                             # and still run (with partial results) without root
#       timeout: 60           # seconds (default 60)
#       shell: true           # multi-line script, sent as `sh -c '<script>'`
#       default: |            # the command, for any system
#       debian: |             # variant for this distribution family: matched against ID, then
#                             # ID_LIKE of /etc/os-release (connection.os_release): "debian"
#                             # also covers Ubuntu, Raspbian…
#
# Values are inserted with @{name}, always shell-escaped (Shellwords) by
# Ssh::Commands: a value can never break out of its word.
# Output sections are separated by "@@elio <name>" lines, read by the parsers.

connection:
  sudo_probe:
    description: "Can root commands run through sudo without a password? Checked once per session (not when logged in as root)."
    timeout: 10
    default: "sudo -n true"

  check:
    description: "Login test of the server page: echoes a random token."
    timeout: 10
    default: "echo @{token}"

  os_release:
    description: "Distribution family (ID and ID_LIKE), to pick the variant of the commands that have one. Read once per session, only when needed."
    timeout: 10
    default: ". /etc/os-release 2>/dev/null && echo \"$ID $ID_LIKE\""

inventory:
  os:
    description: "System: distribution, kernel, host name, virtualization, uptime, processors, memory, time zone."
    shell: true
    default: |
      echo "@@elio os-release"; cat /etc/os-release 2>/dev/null || cat /usr/lib/os-release 2>/dev/null
      echo "@@elio uname"; uname -srm
      echo "@@elio hostname"; hostname -f 2>/dev/null || hostname
      echo "@@elio virt"; systemd-detect-virt 2>/dev/null || true
      echo "@@elio uptime"; cat /proc/uptime
      echo "@@elio cpus"; nproc 2>/dev/null || getconf _NPROCESSORS_ONLN
      echo "@@elio meminfo"; grep -E '^MemTotal:' /proc/meminfo
      echo "@@elio timezone"; timedatectl show -p Timezone --value 2>/dev/null || cat /etc/timezone 2>/dev/null || true

  network:
    description: "Network: interfaces and their addresses (iproute2, JSON)."
    shell: true
    default: |
      echo "@@elio addr"; ip -j addr 2>/dev/null || echo unsupported
      echo "@@elio link"; ip -d -j link 2>/dev/null || true

  health:
    description: "Health: load, memory, disks (space and inodes), reboot required, failed units (name, description, result, since when), pending updates, clock sync, processes killed for lack of memory (kernel counter since boot). The apt simulation, the costly part, is skipped when the package database and the package lists have not changed since the last one (updates_stamp: their modification times then)."
    shell: true
    debian: |
      excluded="-x tmpfs -x devtmpfs -x overlay -x squashfs -x efivarfs -x ramfs -x nsfs -x fuse.lxcfs -x fuse.snapfuse"
      echo "@@elio loadavg"; cat /proc/loadavg
      echo "@@elio cpus"; nproc 2>/dev/null || getconf _NPROCESSORS_ONLN
      echo "@@elio meminfo"; grep -E '^(MemTotal|MemAvailable|SwapTotal|SwapFree):' /proc/meminfo
      echo "@@elio df"; df -P -T -k $excluded 2>/dev/null
      echo "@@elio inodes"; df -P -T -i $excluded 2>/dev/null
      echo "@@elio reboot"; if [ -f /var/run/reboot-required ]; then echo yes; else echo no; fi
      echo "@@elio failed"; systemctl --failed --no-legend --plain 2>/dev/null || true
      echo "@@elio failed_details"; units=$(systemctl --failed --no-legend --plain 2>/dev/null | awk '{ print $1 }'); [ -z "$units" ] || systemctl show --timestamp=unix -p Id -p Description -p Result -p StateChangeTimestamp $units 2>/dev/null || systemctl show -p Id -p Description -p Result -p StateChangeTimestamp $units 2>/dev/null || true
      echo "@@elio updates_stamp"; stamp=$(stat -c %Y /var/lib/dpkg/status /var/lib/apt/lists 2>/dev/null | tr '\n' '.'); echo "$stamp"
      echo "@@elio updates"; if [ -n "$stamp" ] && [ "$stamp" = @{updates_stamp} ]; then echo unchanged; else apt-get -s -o Debug::NoLocking=true dist-upgrade 2>/dev/null | grep '^Inst ' || true; fi
      echo "@@elio ntp"; timedatectl show -p NTPSynchronized --value 2>/dev/null || true
      echo "@@elio oom_kill"; awk '$1 == "oom_kill" { print $2 }' /proc/vmstat 2>/dev/null
      echo "@@elio boot_id"; cat /proc/sys/kernel/random/boot_id 2>/dev/null
    default: |
      excluded="-x tmpfs -x devtmpfs -x overlay -x squashfs -x efivarfs -x ramfs -x nsfs -x fuse.lxcfs -x fuse.snapfuse"
      echo "@@elio loadavg"; cat /proc/loadavg
      echo "@@elio cpus"; nproc 2>/dev/null || getconf _NPROCESSORS_ONLN
      echo "@@elio meminfo"; grep -E '^(MemTotal|MemAvailable|SwapTotal|SwapFree):' /proc/meminfo
      echo "@@elio df"; df -P -T -k $excluded 2>/dev/null
      echo "@@elio inodes"; df -P -T -i $excluded 2>/dev/null
      echo "@@elio reboot"; if [ -f /var/run/reboot-required ]; then echo yes; else echo no; fi
      echo "@@elio failed"; systemctl --failed --no-legend --plain 2>/dev/null || true
      echo "@@elio failed_details"; units=$(systemctl --failed --no-legend --plain 2>/dev/null | awk '{ print $1 }'); [ -z "$units" ] || systemctl show --timestamp=unix -p Id -p Description -p Result -p StateChangeTimestamp $units 2>/dev/null || systemctl show -p Id -p Description -p Result -p StateChangeTimestamp $units 2>/dev/null || true
      # No apt here: the stamp of the last simulation is not used (`:` does nothing).
      : @{updates_stamp}
      echo "@@elio updates"; echo unsupported
      echo "@@elio ntp"; timedatectl show -p NTPSynchronized --value 2>/dev/null || true
      echo "@@elio oom_kill"; awk '$1 == "oom_kill" { print $2 }' /proc/vmstat 2>/dev/null
      echo "@@elio boot_id"; cat /proc/sys/kernel/random/boot_id 2>/dev/null

  packages:
    description: "Packages: dpkg packages (with their source package, for the CVE feeds) and the available updates (security ones flagged), the repository each installed version comes from (apt-cache policy of the installed packages, reduced by awk to one short line per package: numbered sources, then `package<TAB>source numbers`; a package no repository provides gets an empty list; an installed version no longer in the lists gets the repository of the package's other versions), the origin of those repositories (Release fields), the last 50 installs / upgrades / removals of dpkg.log, snaps, Docker presence."
    shell: true
    debian: |
      echo "@@elio dpkg"; dpkg-query -W -f='${db:Status-Abbrev}\t${Package}\t${Version}\t${Architecture}\t${source:Package}\t${source:Version}\t${Built-Using}\n' 2>/dev/null
      echo "@@elio upgradable"; apt list --upgradable 2>/dev/null
      echo "@@elio sources"; LC_ALL=C apt-cache policy 2>/dev/null | awk '/^ *-?[0-9]+ / { src = $0; sub(/^ *-?[0-9]+ /, "", src); next } /^ +release / { sub(/^ +release /, ""); print src "\t" $0 }'
      echo "@@elio origins"; dpkg-query -W -f='${db:Status-Abbrev} ${binary:Package}\n' 2>/dev/null | awk '/^[ih]i/ { print $2 }' | LC_ALL=C xargs -r apt-cache policy 2>/dev/null | awk '
        /^[^ ]/ { pkg = $0; sub(/:$/, "", pkg); state = 0; next }
        /^ \*\*\* / { state = 1; seen[pkg] = 1; next }
        /^     [^ ]/ { state = 2; next }
        state && /^        -?[0-9]+ / { src = $0; sub(/^ +-?[0-9]+ /, "", src); if (src == "/var/lib/dpkg/status") next
          if (!(src in id)) { id[src] = ++n; print "@" n "\t" src }
          if (state == 1) { if (pkg in mine) mine[pkg] = mine[pkg] "," id[src]; else mine[pkg] = id[src] }
          else if (!(pkg in other)) other[pkg] = id[src] }
        END { for (p in seen) print p "\t" ((p in mine) ? mine[p] : ((p in other) ? other[p] : "")) }'
      echo "@@elio history"; grep -h -E '^[0-9-]+ [0-9:]+ (install|upgrade|remove|purge) ' /var/log/dpkg.log 2>/dev/null | tail -n 50
      echo "@@elio snap"; if command -v snap >/dev/null 2>&1; then snap list 2>/dev/null; else echo unsupported; fi
      echo "@@elio docker"; if command -v docker >/dev/null 2>&1; then echo present; fi
    default: |
      echo "@@elio dpkg"; echo unsupported
      echo "@@elio upgradable"
      echo "@@elio snap"; if command -v snap >/dev/null 2>&1; then snap list 2>/dev/null; else echo unsupported; fi
      echo "@@elio docker"; if command -v docker >/dev/null 2>&1; then echo present; fi

  docker_images:
    description: "Docker images (needs the docker group or root)."
    run_as: root
    default: "docker image ls --format '{{.Repository}}\t{{.Tag}}\t{{.ID}}'"

  services:
    description: "Services: systemd units (state, enabled at boot), Docker presence."
    shell: true
    default: |
      echo "@@elio units"; systemctl list-units --type=service --all --no-legend --plain --no-pager 2>/dev/null || echo unsupported
      echo "@@elio unit-files"; systemctl list-unit-files --type=service --no-legend --plain --no-pager 2>/dev/null || true
      echo "@@elio docker"; if command -v docker >/dev/null 2>&1; then echo present; fi

  docker_containers:
    description: "Docker containers with their Compose project (labels set by Docker Compose; needs the docker group or root). No {{.State}}: it only exists since Docker 20.10, the state is read from {{.Status}}."
    run_as: root
    default: "docker ps -a --no-trunc --format '{{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}\t{{.Label \"com.docker.compose.project\"}}\t{{.Label \"com.docker.compose.project.working_dir\"}}\t{{.Label \"com.docker.compose.project.config_files\"}}\t{{.Label \"com.docker.compose.service\"}}'"

  docker:
    description: "Docker: containers (state, health check, restarts, Compose project, privileged or not, mounts, networks, published ports; never their environment), their CPU / memory, images (tags, digests, age, size), scanners installed (Trivy, Grype). Needs the docker group or root."
    run_as: root
    shell: true
    timeout: 120
    default: |
      echo "@@elio access"; if ! command -v docker >/dev/null 2>&1; then echo absent; exit 0; fi
      version=$(docker version --format '{{.Server.Version}}' 2>/dev/null)
      if [ -z "$version" ]; then docker version 2>&1 | grep -i -m 1 -E 'denied|cannot|error' || echo unreadable; exit 0; fi
      echo "$version"
      echo "@@elio containers"; ids=$(docker ps -aq --no-trunc 2>/dev/null)
      if [ -n "$ids" ]; then docker inspect --format '{{.Id}}	{{.Name}}	{{.Config.Image}}	{{.Image}}	{{.State.Status}}	{{.RestartCount}}	{{with index .State "Health"}}{{index . "Status"}}{{end}}	{{.State.StartedAt}}	{{.State.FinishedAt}}	{{.State.ExitCode}}	{{.HostConfig.RestartPolicy.Name}}	{{.Created}}	{{with .Config.Labels}}{{index . "com.docker.compose.project"}}{{end}}	{{with .Config.Labels}}{{index . "com.docker.compose.service"}}{{end}}	{{.HostConfig.Privileged}}	{{json .Mounts}}	{{range $name, $network := .NetworkSettings.Networks}}{{$name}} {{end}}	{{json .NetworkSettings.Ports}}' $ids 2>/dev/null; fi
      echo "@@elio stats"; if [ -n "$ids" ]; then docker stats --no-stream --no-trunc --format '{{.ID}}	{{.CPUPerc}}	{{.MemUsage}}	{{.MemPerc}}' 2>/dev/null; fi
      echo "@@elio images"; images=$(docker image ls -q --no-trunc 2>/dev/null | sort -u)
      if [ -n "$images" ]; then docker image inspect --format '{{.Id}}	{{json .RepoTags}}	{{json .RepoDigests}}	{{.Created}}	{{.Size}}	{{.Os}}/{{.Architecture}}' $images 2>/dev/null; fi
      echo "@@elio scanners"; for tool in trivy grype; do if command -v $tool >/dev/null 2>&1; then echo $tool; fi; done

  docker_df:
    description: "Docker disk usage (docker system df). Slow on big hosts: read every few hours, not at every collection. Needs the docker group or root."
    run_as: root
    timeout: 120
    default: "docker system df --format '{{.Type}}\t{{.TotalCount}}\t{{.Active}}\t{{.Size}}\t{{.Reclaimable}}'"

  docker_image_packages:
    description: "System and Debian / Ubuntu packages of an image, copied out of one of its containers (docker cp, read-only), for Elio to match with the vulnerability feeds when neither Trivy nor Grype is installed."
    run_as: root
    shell: true
    default: |
      echo "@@elio os-release"; docker cp -L @{container}:/etc/os-release - 2>/dev/null | tar -xO 2>/dev/null
      echo "@@elio dpkg"; docker cp -L @{container}:/var/lib/dpkg/status - 2>/dev/null | tar -xO 2>/dev/null

  trivy_scan:
    description: "Vulnerabilities of a Docker image with Trivy, when it is installed (Trivy only writes its own cache). A template prints one line per CVE with the fields Elio keeps: the JSON report of an image weighs tens of megabytes."
    run_as: root
    timeout: 300
    default: |-
      trivy image --quiet --scanners vuln --format template --template '{{- range . }}@@os{{ "\t" }}{{ .Class }}{{ "\t" }}{{ .Type }}{{ "\t" }}{{ .Target }}{{ "\n" }}{{- range .Vulnerabilities }}{{ .VulnerabilityID }}{{ "\t" }}{{ .PkgName }}{{ "\t" }}{{ .InstalledVersion }}{{ "\t" }}{{ .FixedVersion }}{{ "\t" }}{{ .Severity }}{{ "\t" }}{{ .Title }}{{ "\n" }}{{- end }}{{- end }}' @{image}

  grype_scan:
    description: "Vulnerabilities of a Docker image with Grype, when it is installed and Trivy is not (Grype only writes its own cache)."
    run_as: root
    timeout: 300
    default: "grype --quiet -o json @{image}"

  scheduled_tasks:
    description: "Scheduled tasks: system crontabs (/etc/crontab, /etc/cron.d, cron.hourly…monthly scripts), users' crontabs (root only), systemd timers with their last run and its result."
    run_as: root
    shell: true
    default: |
      echo "@@elio uptime"; cat /proc/uptime 2>/dev/null
      echo "@@elio crontab"; cat /etc/crontab 2>/dev/null || true
      echo "@@elio cron.d"; for f in /etc/cron.d/*; do [ -f "$f" ] || continue; echo "@@file $f"; cat "$f" 2>/dev/null; done
      echo "@@elio periodic"; for d in hourly daily weekly monthly; do for f in /etc/cron.$d/*; do if [ -f "$f" ] && [ -x "$f" ]; then echo "$d ${f##*/}"; fi; done; done
      echo "@@elio users"; for dir in /var/spool/cron/crontabs /var/spool/cron; do
        [ -d "$dir" ] || continue
        if ! ls "$dir" >/dev/null 2>&1; then echo unreadable; break; fi
        for f in "$dir"/*; do [ -f "$f" ] || continue; echo "@@file ${f##*/}"; cat "$f" 2>/dev/null; done; break
      done
      echo "@@elio timers"; if command -v systemctl >/dev/null 2>&1; then
        for t in $(systemctl list-units --type=timer --all --no-legend --plain --no-pager 2>/dev/null | awk '{print $1}'); do
          props="-p Id -p Description -p Unit -p ActiveState -p UnitFileState -p TimersCalendar -p TimersMonotonic -p LastTriggerUSec -p NextElapseUSecRealtime"
          systemctl show "$t" --timestamp=unix $props 2>/dev/null || systemctl show "$t" $props 2>/dev/null
          unit=$(systemctl show "$t" -p Unit --value 2>/dev/null)
          if [ -n "$unit" ]; then systemctl show "$unit" -p Result -p ExecMainStatus 2>/dev/null | sed 's/^/Service/'; fi
          echo
        done
      else echo unsupported; fi

  ports:
    description: "Ports: listening sockets with their process and systemd unit, firewall state (ufw, else firewalld, else nftables, else iptables), the IPv6 INPUT chain, and the DOCKER-USER chain (Docker's published ports bypass ufw / firewalld; rules there filter them). Read-only: Elio never changes the firewall."
    run_as: root
    shell: true
    default: |
      echo "@@elio ss"; ss -H -tulpn 2>/dev/null || ss -H -tuln 2>/dev/null || echo unsupported
      echo "@@elio cgroups"; for pid in $(ss -H -tulpn 2>/dev/null | grep -o 'pid=[0-9]*' | cut -d= -f2 | sort -u); do printf '%s ' "$pid"; head -n 1 "/proc/$pid/cgroup" 2>/dev/null || echo; done
      echo "@@elio ufw"; if command -v ufw >/dev/null 2>&1; then ufw status verbose 2>&1; else echo absent; fi
      echo "@@elio nft"; if command -v nft >/dev/null 2>&1; then nft list ruleset 2>&1 | head -c 200000; else echo absent; fi
      echo "@@elio iptables"; if command -v iptables >/dev/null 2>&1; then iptables -S INPUT 2>&1; else echo absent; fi
      echo "@@elio ip6tables"; if command -v ip6tables >/dev/null 2>&1; then ip6tables -S INPUT 2>&1; else echo absent; fi
      echo "@@elio docker_user"; if command -v iptables >/dev/null 2>&1; then iptables -S DOCKER-USER 2>&1; else echo absent; fi
      echo "@@elio firewalld"
      if ! command -v firewall-cmd >/dev/null 2>&1; then echo absent
      elif ! firewall-cmd --state >/dev/null 2>&1; then echo "not running"
      else
        zones=$({ firewall-cmd --get-default-zone; firewall-cmd --get-active-zones | grep -v '^[[:space:]]' | cut -d' ' -f1; } 2>/dev/null | sort -u)
        for zone in $zones; do firewall-cmd --list-all --zone="$zone" 2>&1; done
        echo "@@elio firewalld_services"
        for service in $(for zone in $zones; do firewall-cmd --list-services --zone="$zone" 2>/dev/null; done | tr ' ' '\n' | sort -u); do firewall-cmd --info-service="$service" 2>&1; done
      fi

# The only commands that change something: the authorized_keys file of the
# account Elio logs in as (~/.ssh/authorized_keys), or of another account
# through root, when a key is added, replaced or removed from Elio. Other
# lines are kept byte for byte, the file keeps its owner and permissions.
keys:
  read:
    description: "Reads ~/.ssh/authorized_keys (a missing file means no keys)."
    shell: true
    default: |
      set -e
      file="$HOME/.ssh/authorized_keys"
      if [ -f "$file" ]; then cat "$file"; fi

  append:
    description: "Adds a key line unless its key is already there (creates ~/.ssh in 700 and the file in 600). Prints present or added."
    writes: true
    shell: true
    default: |
      set -e
      umask 077
      mkdir -p "$HOME/.ssh"
      file="$HOME/.ssh/authorized_keys"
      touch "$file"
      if grep -qF -- @{blob} "$file"; then
        echo present
      else
        if [ -s "$file" ] && [ -n "$(tail -c 1 "$file")" ]; then echo >> "$file"; fi
        printf '%s\n' @{line} >> "$file"
        echo added
      fi

  replace:
    description: "Replaces the lines of a key by a new line (changes or removes a temporary access expiry). Prints added."
    writes: true
    shell: true
    default: |
      set -e
      umask 077
      mkdir -p "$HOME/.ssh"
      file="$HOME/.ssh/authorized_keys"
      touch "$file"
      tmp=$(mktemp "$HOME/.ssh/authorized_keys.XXXXXX")
      trap 'rm -f "$tmp"' EXIT
      awk -v blob=@{blob} '{ for (i = 1; i <= NF; i++) if ($i == blob) next; print }' "$file" > "$tmp"
      cat "$tmp" > "$file"
      if [ -s "$file" ] && [ -n "$(tail -c 1 "$file")" ]; then echo >> "$file"; fi
      printf '%s\n' @{line} >> "$file"
      echo added

  extend:
    description: "Extends a temporary access: changes only the expiry-time option of the lines of a key (its other options, comment and the other lines are kept byte for byte). Prints absent (no expiring line for the key) or extended."
    writes: true
    shell: true
    default: |
      set -e
      file="$HOME/.ssh/authorized_keys"
      if [ ! -f "$file" ]; then echo absent; exit 0; fi
      matches=$(awk -v blob=@{blob} '/expiry-time="/ { for (i = 1; i <= NF; i++) if ($i == blob) { n++; break } } END { print n + 0 }' "$file")
      if [ "$matches" -eq 0 ]; then echo absent; exit 0; fi
      tmp=$(mktemp "$HOME/.ssh/authorized_keys.XXXXXX")
      trap 'rm -f "$tmp"' EXIT
      awk -v blob=@{blob} -v expiry=@{expiry} '{ for (i = 1; i <= NF; i++) if ($i == blob) { sub(/expiry-time="[0-9]+Z?"/, "expiry-time=\"" expiry "\""); break } print }' "$file" > "$tmp"
      cat "$tmp" > "$file"
      echo extended

  remove:
    description: "Removes every line whose key is the given one. Prints absent or removed."
    writes: true
    shell: true
    default: |
      set -e
      file="$HOME/.ssh/authorized_keys"
      if [ ! -f "$file" ]; then echo absent; exit 0; fi
      matches=$(awk -v blob=@{blob} '{ for (i = 1; i <= NF; i++) if ($i == blob) { n++; break } } END { print n + 0 }' "$file")
      if [ "$matches" -eq 0 ]; then echo absent; exit 0; fi
      tmp=$(mktemp "$HOME/.ssh/authorized_keys.XXXXXX")
      trap 'rm -f "$tmp"' EXIT
      awk -v blob=@{blob} '{ for (i = 1; i <= NF; i++) if ($i == blob) next; print }' "$file" > "$tmp"
      cat "$tmp" > "$file"
      echo removed

  read_accounts:
    description: "Reads ~/.ssh/authorized_keys of every account that has a login shell and a home (root included), one section per account with a file. Needs root to list the accounts; each file is read as its account (runuser). Refuses a link or a file the account does not own."
    run_as: root
    shell: true
    default: |
      getent passwd | while IFS=: read -r user _ _ _ _ home shell; do
        case "$shell" in */nologin|*/false|*/sync|"") continue ;; esac
        [ -n "$home" ] && [ -f "$home/.ssh/authorized_keys" ] || continue
        printf '@@elio account %s\n' "$user"
        # Read as the account itself (runuser), never as root; a link or a file the user does not own is refused.
        if [ -L "$home/.ssh" ] || [ -L "$home/.ssh/authorized_keys" ] || [ "$(ls -ld "$home/.ssh/authorized_keys" 2>/dev/null | awk '{ print $3 }')" != "$user" ]; then
          printf '@@elio unreadable\n'; continue
        fi
        runuser -u "$user" -- cat "$home/.ssh/authorized_keys" 2>/dev/null || printf '@@elio unreadable\n'
      done

  append_to_account:
    description: "Adds a key line to the authorized_keys of another account unless its key is already there (creates its ~/.ssh in 700 and the file in 600). Root only finds the account: the file is read and written as the account itself (runuser), so a link it made leads nowhere it could not already write. Refuses an unknown account, a link, or a directory or file the account does not own. Prints present or added."
    writes: true
    run_as: root
    shell: true
    default: |
        set -e
        home=$(getent passwd @{user} | cut -d: -f6)
        if [ -z "$home" ] || [ ! -d "$home" ]; then echo "unknown user" >&2; exit 3; fi
        # ~/.ssh created by root only in a home the account cannot write to (it cannot swap anything there).
        if [ ! -e "$home/.ssh" ] && [ ! -L "$home/.ssh" ] && ! runuser -u @{user} -- test -w "$home"; then mkdir -m 700 "$home/.ssh"; chown @{user}: "$home/.ssh"; fi
        runuser -u @{user} -- sh -s -- "$home" @{user} @{line} @{blob} <<'ELIO'
        set -e
        home=$1 user=$2
        refuse() { echo "not owned by the account" >&2; exit 4; }
        if [ -L "$home/.ssh" ] || [ -L "$home/.ssh/authorized_keys" ]; then refuse; fi
        umask 077
        [ -e "$home/.ssh" ] || mkdir "$home/.ssh"
        if [ "$(ls -ld "$home/.ssh" | awk '{ print $3 }')" != "$user" ]; then refuse; fi
        file="$home/.ssh/authorized_keys"
        [ -e "$file" ] || : > "$file"
        if [ "$(ls -ld "$file" | awk '{ print $3 }')" != "$user" ]; then refuse; fi
        line=$3 blob=$4
        if grep -qF -- "$blob" "$file"; then echo present; exit 0; fi
        if [ -s "$file" ] && [ -n "$(tail -c 1 "$file")" ]; then echo >> "$file"; fi
        printf '%s\n' "$line" >> "$file"
        echo added
        ELIO

  replace_in_account:
    description: "Replaces the lines of a key by a new line in the authorized_keys of another account (changes or removes a temporary access expiry). Same as append_to_account: root only finds the account, the file is written as the account. Prints added."
    writes: true
    run_as: root
    shell: true
    default: |
        set -e
        home=$(getent passwd @{user} | cut -d: -f6)
        if [ -z "$home" ] || [ ! -d "$home" ]; then echo "unknown user" >&2; exit 3; fi
        # ~/.ssh created by root only in a home the account cannot write to (it cannot swap anything there).
        if [ ! -e "$home/.ssh" ] && [ ! -L "$home/.ssh" ] && ! runuser -u @{user} -- test -w "$home"; then mkdir -m 700 "$home/.ssh"; chown @{user}: "$home/.ssh"; fi
        runuser -u @{user} -- sh -s -- "$home" @{user} @{line} @{blob} <<'ELIO'
        set -e
        home=$1 user=$2
        refuse() { echo "not owned by the account" >&2; exit 4; }
        if [ -L "$home/.ssh" ] || [ -L "$home/.ssh/authorized_keys" ]; then refuse; fi
        umask 077
        [ -e "$home/.ssh" ] || mkdir "$home/.ssh"
        if [ "$(ls -ld "$home/.ssh" | awk '{ print $3 }')" != "$user" ]; then refuse; fi
        file="$home/.ssh/authorized_keys"
        [ -e "$file" ] || : > "$file"
        if [ "$(ls -ld "$file" | awk '{ print $3 }')" != "$user" ]; then refuse; fi
        line=$3 blob=$4
        tmp=$(mktemp "$home/.ssh/authorized_keys.XXXXXX")
        trap 'rm -f "$tmp"' EXIT
        awk -v blob="$blob" '{ for (i = 1; i <= NF; i++) if ($i == blob) next; print }' "$file" > "$tmp"
        cat "$tmp" > "$file"
        if [ -s "$file" ] && [ -n "$(tail -c 1 "$file")" ]; then echo >> "$file"; fi
        printf '%s\n' "$line" >> "$file"
        echo added
        ELIO

  extend_in_account:
    description: "Extends a temporary access on another account: changes only the expiry-time option of the lines of a key in its authorized_keys. Same as remove_from_account: root only finds the account, the file is read and written as the account. Prints absent or extended."
    writes: true
    run_as: root
    shell: true
    default: |
        set -e
        home=$(getent passwd @{user} | cut -d: -f6)
        if [ -z "$home" ]; then echo "unknown user" >&2; exit 3; fi
        if [ ! -f "$home/.ssh/authorized_keys" ]; then echo absent; exit 0; fi
        runuser -u @{user} -- sh -s -- "$home" @{user} @{blob} @{expiry} <<'ELIO'
        set -e
        home=$1 user=$2
        refuse() { echo "not owned by the account" >&2; exit 4; }
        if [ -L "$home/.ssh" ] || [ -L "$home/.ssh/authorized_keys" ]; then refuse; fi
        blob=$3 expiry=$4
        file="$home/.ssh/authorized_keys"
        if [ "$(ls -ld "$file" | awk '{ print $3 }')" != "$user" ]; then refuse; fi
        matches=$(awk -v blob="$blob" '/expiry-time="/ { for (i = 1; i <= NF; i++) if ($i == blob) { n++; break } } END { print n + 0 }' "$file")
        if [ "$matches" -eq 0 ]; then echo absent; exit 0; fi
        tmp=$(mktemp "$home/.ssh/authorized_keys.XXXXXX")
        trap 'rm -f "$tmp"' EXIT
        awk -v blob="$blob" -v expiry="$expiry" '{ for (i = 1; i <= NF; i++) if ($i == blob) { sub(/expiry-time="[0-9]+Z?"/, "expiry-time=\"" expiry "\""); break } print }' "$file" > "$tmp"
        cat "$tmp" > "$file"
        echo extended
        ELIO

  remove_from_account:
    description: "Removes every line whose key is the given one from the authorized_keys of another account (keeps its owner and rights). Root only finds the account: the file is read and written as the account itself (runuser). Refuses a link or a file the account does not own. Prints absent or removed."
    writes: true
    run_as: root
    shell: true
    default: |
        set -e
        home=$(getent passwd @{user} | cut -d: -f6)
        if [ -z "$home" ]; then echo "unknown user" >&2; exit 3; fi
        if [ ! -f "$home/.ssh/authorized_keys" ]; then echo absent; exit 0; fi
        runuser -u @{user} -- sh -s -- "$home" @{user} @{blob} <<'ELIO'
        set -e
        home=$1 user=$2
        refuse() { echo "not owned by the account" >&2; exit 4; }
        if [ -L "$home/.ssh" ] || [ -L "$home/.ssh/authorized_keys" ]; then refuse; fi
        blob=$3
        file="$home/.ssh/authorized_keys"
        if [ "$(ls -ld "$file" | awk '{ print $3 }')" != "$user" ]; then refuse; fi
        matches=$(awk -v blob="$blob" '{ for (i = 1; i <= NF; i++) if ($i == blob) { n++; break } } END { print n + 0 }' "$file")
        if [ "$matches" -eq 0 ]; then echo absent; exit 0; fi
        tmp=$(mktemp "$home/.ssh/authorized_keys.XXXXXX")
        trap 'rm -f "$tmp"' EXIT
        awk -v blob="$blob" '{ for (i = 1; i <= NF; i++) if ($i == blob) next; print }' "$file" > "$tmp"
        cat "$tmp" > "$file"
        echo removed
        ELIO

